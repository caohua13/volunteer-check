<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="format-detection" content="telephone=no,email=no,address=no" />
<meta name="theme-color" content="#C8322B" />
<title>志愿者信息核对</title>
<style>
  :root{--red:#C8322B;--red-dark:#a82822;--red-soft:#fdeceb;--text:#1f1f1f;--muted:#8a8079;--line:#efe9e7}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:#fff;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.55;padding-bottom:96px}
  .wrap{max-width:520px;margin:0 auto;padding:26px 18px 40px}
  .brand{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--red);background:var(--red-soft);padding:6px 12px;border-radius:999px}
  .brand::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red)}
  h1.title{font-size:26px;line-height:1.25;font-weight:800;letter-spacing:-.4px;margin:16px 0 8px}
  .subtitle{margin:0 0 20px;color:var(--muted);font-size:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 24px rgba(31,31,31,.05)}
  .search{padding:18px}
  .field-label{display:block;margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
  .input-wrap{position:relative}
  .input{display:block;width:100%;height:54px;padding:0 58px 0 16px;border:1.5px solid var(--line);border-radius:14px;background:#fbfafa;font-family:inherit;font-size:17px;letter-spacing:.06em;color:var(--text);outline:none;transition:border-color .15s,background .15s,box-shadow .15s}
  .input::placeholder{color:#c3bbb7;letter-spacing:0;font-size:15px}
  .input:focus{border-color:var(--red);background:#fff;box-shadow:0 0 0 4px rgba(200,50,43,.09)}
  .xbtn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--muted);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
  .xbtn:active{background:var(--red-soft);color:var(--red)}
  .tip{margin:8px 0 0;min-height:18px;font-size:13px;line-height:1.4;color:var(--red);font-weight:600}
  .tip:empty{margin:0;min-height:0}
  .btn{display:block;width:100%;height:52px;margin-top:14px;border:0;border-radius:14px;background:var(--red);color:#fff;font-family:inherit;font-size:17px;font-weight:700;letter-spacing:.24em;cursor:pointer;box-shadow:0 8px 18px rgba(200,50,43,.24);transition:transform .1s,background .15s}
  .btn:active{transform:scale(.985);background:var(--red-dark)}
  .result{margin-top:18px;scroll-margin-top:18px}
  .result-card{padding:20px 18px 0;animation:rise .22s ease-out}
  .result-head{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
  .result-name{font-size:26px;font-weight:800}
  .badge{display:inline-flex;align-items:center;gap:4px;background:var(--red);color:#fff;font-size:12px;font-weight:700;letter-spacing:.08em;padding:5px 11px;border-radius:999px;box-shadow:0 4px 10px rgba(200,50,43,.28)}
  .kv{display:grid;grid-template-columns:minmax(72px,auto) 1fr;column-gap:16px;margin:0;padding:8px 0 4px}
  .kv-k{margin:0;padding:9px 0;font-size:14px;color:var(--muted);white-space:nowrap}
  .kv-v{margin:0;padding:9px 0;font-size:15px;font-weight:600;word-break:break-all}
  .result-hint{margin:12px -18px 0;padding:13px 18px;border-top:1px solid var(--line);background:#fcfaf9;border-radius:0 0 18px 18px;font-size:12.5px;color:var(--muted);text-align:center;line-height:1.5}
  .miss-card{padding:30px 20px;text-align:center;animation:rise .22s ease-out}
  .miss-icon{font-size:26px;line-height:1;margin-bottom:10px}
  .miss-text{margin:0;font-size:15px;color:#5d554f;line-height:1.65}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .footer{position:fixed;left:0;right:0;bottom:0;display:none;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12.5px;letter-spacing:.14em;color:#9a8f89;background:rgba(255,255,255,.95);border-top:1px solid var(--line)}
  .footer.show{display:block}
  .confirm-box{margin:16px 0 18px;padding:16px;border-radius:14px;background:#fdf6f5;border:1px solid #f2d9d6}
  .confirm-label{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;cursor:pointer;user-select:none}
  .confirm-cb{width:22px;height:22px;accent-color:var(--red);cursor:pointer;flex:none}
  .confirm-msg{margin:10px 0 0;font-size:13px;line-height:1.5;color:#8a8078}
  .confirm-msg.ok{color:#1a7f37;font-weight:700}
  .confirm-msg.err{color:var(--red);font-weight:700}
  @media (min-width:640px){.wrap{padding-top:56px}h1.title{font-size:30px}.result-name{font-size:28px}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <span class="brand">青年志愿者联合会</span>
    <h1 class="title">志愿者信息核对</h1>
    <p class="subtitle">请输入本人身份证号查询</p>
  </header>
  <section class="card search" aria-label="身份证号查询">
    <label class="field-label" for="idInput">身份证号</label>
    <div class="input-wrap">
      <input id="idInput" class="input" type="text" inputmode="numeric" maxlength="18" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" placeholder="请输入 18 位身份证号" />
      <button type="button" id="btnX" class="xbtn" aria-label="输入字母 X">X</button>
    </div>
    <p id="tip" class="tip" role="alert"></p>
    <button type="button" id="btnQuery" class="btn">查询</button>
  </section>
  <section id="result" class="result" aria-live="polite"></section>
</main>
<footer id="footer" class="footer">青年志愿者联合会竭诚为您服务</footer>
<script src="data.js"></script>
<script>
(function () {
  'use strict';
  /*SHA256-START*/
  var sha256 = function (ascii) {
    function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
    var mathPow = Math.pow, maxWord = mathPow(2, 32), lengthProperty = 'length', i, j;
    var result = '', words = [], asciiBitLength = ascii[lengthProperty] * 8;
    var hash = sha256.h = sha256.h || [], k = sha256.k = sha256.k || [];
    var primeCounter = k[lengthProperty], isComposite = {};
    for (var candidate = 2; primeCounter < 64; candidate++) {
      if (!isComposite[candidate]) {
        for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
        hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
        k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
      }
    }
    ascii += '\x80';
    while (ascii[lengthProperty] % 64 - 56) ascii += '\x00';
    for (i = 0; i < ascii[lengthProperty]; i++) {
      j = ascii.charCodeAt(i);
      if (j >> 8) return '';
      words[i >> 2] |= j << ((3 - i) % 4) * 8;
    }
    words[words[lengthProperty]] = (asciiBitLength / maxWord) | 0;
    words[words[lengthProperty]] = asciiBitLength;
    for (j = 0; j < words[lengthProperty];) {
      var w = words.slice(j, (j += 16)), oldHash = hash;
      hash = hash.slice(0, 8);
      for (i = 0; i < 64; i++) {
        var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
        var temp1 = hash[7] + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
          + ((e & hash[5]) ^ (~e & hash[6])) + k[i]
          + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
            + w[i - 7] + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10)))) | 0;
        var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
          + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(temp1 + temp2) | 0].concat(hash);
        hash[4] = (hash[4] + temp1) | 0;
      }
      for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
    }
    for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) {
      var b = (hash[i] >> (j * 8)) & 255;
      result += (b < 16 ? '0' : '') + b.toString(16);
    }
    return result;
  };
  /*SHA256-END*/
  function sha256Hex(s) { return sha256(String(s)); }

  var D = window.VOLUNTEER_DATA || {};
  if (!D.records || typeof D.records !== 'object') D.records = {};
  function normalizeId(v) { return String(v == null ? '' : v).replace(/[\s\u3000]/g, '').toUpperCase(); }
  if (Object.prototype.toString.call(D.demoRecords) === '[object Array]') {
    D.demoRecords.forEach(function (item) {
      if (!item || !item.id) return;
      D.records[sha256Hex(normalizeId(item.id))] = { name: item.name || '', isLeader: item.isLeader === true, fields: item.fields || [] };
    });
    D.demoRecords = null;
  }

  var input = document.getElementById('idInput'), btnQuery = document.getElementById('btnQuery');
  var btnX = document.getElementById('btnX'), tipEl = document.getElementById('tip');
  var resultEl = document.getElementById('result'), footer = document.getElementById('footer');
  var FORBIDDEN_FIELD = /带队|老师|教师|teacher|coach/i;

  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = String(text); return n; }
  function fmt(v) { if (v === null || v === undefined) return '—'; var s = String(v).trim(); return s === '' ? '—' : s; }
  function isValidId(v) { return /^\d{17}[0-9X]$/.test(v); }

  function renderRecord(rec, hash) {
    var card = el('div', 'card result-card'), head = el('div', 'result-head');
    head.appendChild(el('div', 'result-name', rec.name || '（未填写姓名）'));
    if (rec.isLeader === true) head.appendChild(el('span', 'badge', '★ 小组长'));
    card.appendChild(head);
    var list = el('dl', 'kv'), fields = rec.fields || [];
    for (var i = 0; i < fields.length; i++) {
      var p = fields[i];
      if (!p || p.length < 2) continue;
      var k = String(p[0] == null ? '' : p[0]);
      if (FORBIDDEN_FIELD.test(k)) continue;
      list.appendChild(el('dt', 'kv-k', k));
      list.appendChild(el('dd', 'kv-v', fmt(p[1])));
    }
    if (list.children.length) card.appendChild(list);
    card.appendChild(el('p', 'result-hint', '如发现信息不正确，请联系群内的负责人'));
    if (hash) card.appendChild(renderConfirm(hash));
    return card;
  }
  /* ===== 确认核对状态（Supabase，带超时 / 自动重试 / 本地离线队列） ===== */
  var SB_URL = 'https://yebqnmumrufkmubviirk.supabase.co';
  var SB_KEY = 'sb_publishable_k0yzjSc5OrCBxAskGB233Q_zgl16_pg';
  var SB_HDR = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
  var DONE_KEY = 'vc_done_v1', Q_KEY = 'vc_queue_v1';

  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : JSON.parse(d); } catch (e) { return JSON.parse(d); } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function markDone(h) { var a = lsGet(DONE_KEY, '[]'); if (a.indexOf(h) < 0) { a.push(h); lsSet(DONE_KEY, a); } }
  function isDone(h) { return lsGet(DONE_KEY, '[]').indexOf(h) >= 0; }
  function queuePush(h) { var a = lsGet(Q_KEY, '[]'); if (a.indexOf(h) < 0) { a.push(h); lsSet(Q_KEY, a); } }
  function queueDrop(hs) { lsSet(Q_KEY, lsGet(Q_KEY, '[]').filter(function (x) { return hs.indexOf(x) < 0; })); }

  /* 带超时 + 指数退避重试的请求（跨境网络抖动自动兜住） */
  function sbFetch(url, opts, tries, timeout) {
    tries = tries || 3; timeout = timeout || 9000;
    return new Promise(function (resolve, reject) {
      (function attempt(n) {
        var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, timeout);
        var o = {}; for (var k in (opts || {})) o[k] = opts[k];
        if (ctrl) o.signal = ctrl.signal;
        fetch(url, o).then(function (r) {
          clearTimeout(timer);
          if (r.ok || r.status === 409) return resolve(r);       /* 409 = 已存在，也算成功 */
          if (n < tries) { setTimeout(function () { attempt(n + 1); }, 600 * Math.pow(2, n - 1)); return; }
          resolve(r);
        }).catch(function (e) {
          clearTimeout(timer);
          if (n < tries) setTimeout(function () { attempt(n + 1); }, 600 * Math.pow(2, n - 1));
          else reject(e);
        });
      })(1);
    });
  }

  /* 把本地攒下的确认记录批量补交 */
  function flushQueue() {
    var q = lsGet(Q_KEY, '[]');
    if (!q.length) return;
    sbFetch(SB_URL + '/rest/v1/confirmations', {
      method: 'POST',
      headers: Object.assign({}, SB_HDR, { 'Prefer': 'resolution=merge-duplicates' }),
      body: JSON.stringify(q.map(function (h) { return { id_hash: h }; }))
    }, 2, 12000).then(function (r) {
      if (r.ok || r.status === 409) { q.forEach(markDone); queueDrop(q); }
    }).catch(function () {});
  }

  /* 页面一打开就先建好连接，省掉后面的握手延迟 */
  try { sbFetch(SB_URL + '/rest/v1/confirmations?select=id_hash&limit=1', { headers: SB_HDR }, 1, 8000).catch(function () {}); } catch (e) {}
  setTimeout(flushQueue, 1500);
  window.addEventListener('online', flushQueue);

  function renderConfirm(hash) {
    var box = el('div', 'confirm-box');
    var label = el('label', 'confirm-label');
    var cb = document.createElement('input');
    cb.type = 'checkbox'; cb.className = 'confirm-cb'; cb.id = 'confirmBox';
    label.appendChild(cb);
    label.appendChild(document.createTextNode('\u6211\u5df2\u6838\u5bf9\uff0c\u4ee5\u4e0a\u4fe1\u606f\u786e\u8ba4\u65e0\u8bef'));
    box.appendChild(label);
    var msg = el('p', 'confirm-msg', '');
    msg.id = 'confirmMsg';
    box.appendChild(msg);

    function setDone(txt) {
      cb.checked = true; cb.disabled = true;
      label.style.cursor = 'default';
      msg.className = 'confirm-msg ok';
      msg.textContent = txt || '\u2705 \u60a8\u5df2\u5b8c\u6210\u6838\u5bf9\uff0c\u611f\u8c22\u914d\u5408\uff01';
    }
    function setPending() {
      cb.checked = true; cb.disabled = true;
      msg.className = 'confirm-msg';
      msg.textContent = '\u63d0\u4ea4\u4e2d\u2026';
    }

    if (isDone(hash)) { setDone(); }
    else {
      sbFetch(SB_URL + '/rest/v1/confirmations?select=id_hash&id_hash=eq.' + encodeURIComponent(hash), { headers: SB_HDR }, 2, 8000)
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (arr) { if (arr && arr.length) { markDone(hash); setDone(); } })
        .catch(function () {});
    }

    cb.addEventListener('change', function () {
      if (!cb.checked) return;
      setPending();
      markDone(hash);    /* 本地立刻记住，避免重复提交 */
      queuePush(hash);   /* 先入队，确保不丢 */
      sbFetch(SB_URL + '/rest/v1/confirmations', {
        method: 'POST',
        headers: Object.assign({}, SB_HDR, { 'Prefer': 'resolution=merge-duplicates' }),
        body: JSON.stringify([{ id_hash: hash }])
      }, 3, 10000).then(function (r) {
        if (!r.ok && r.status !== 409) throw new Error('HTTP ' + r.status);
        queueDrop([hash]);
        setDone();
        try { if (window.umami) umami.track('confirm'); } catch (e) {}
      }).catch(function () {
        setDone('\u2705 \u5df2\u8bb0\u5f55\uff08\u7f51\u7edc\u8f83\u6162\uff0c\u4e0b\u6b21\u6253\u5f00\u4f1a\u81ea\u52a8\u540c\u6b65\uff09');
      });
    });
  function scrollToResult() {
    setTimeout(function () { try { resultEl.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) { resultEl.scrollIntoView(); } }, 30);
  }
  function doQuery() {
    tipEl.textContent = '';
    var id = normalizeId(input.value); input.value = id;
    if (!isValidId(id)) { tipEl.textContent = '请检查身份证号格式（18 位）'; resultEl.innerHTML = ''; try { input.focus(); } catch (e) {} return; }
    var h = sha256Hex(id);
    var rec = D.records[h];
    resultEl.innerHTML = '';
    resultEl.appendChild(rec ? renderRecord(rec, h) : renderMiss());
    footer.classList.add('show'); scrollToResult();
  }
  input.addEventListener('input', function () {
    var v = normalizeId(input.value);
    if (v !== input.value) { input.value = v; try { input.setSelectionRange(v.length, v.length); } catch (e) {} }
    if (tipEl.textContent) tipEl.textContent = '';
  });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.keyCode === 13) { e.preventDefault(); doQuery(); } });
  btnX.addEventListener('click', function () { var v = normalizeId(input.value); if (v.length === 17) input.value = v + 'X'; try { input.focus(); } catch (e) {} });
  btnQuery.addEventListener('click', doQuery);
})();
</script>
</body>
</html>
